name: Watchlist Scanner — high-frequency

on:
  schedule:
    # 3× daily at 05:47, 13:47, 21:47 UTC (07:47, 15:47, 23:47 CEST).
    # Offset from the deal scanner (:17 every 2h) so the two never start
    # together — they used to fire simultaneously at 06/14/22 UTC and race
    # on `git push` (the loser's data was silently dropped).
    - cron: '47 5,13,21 * * *'
  workflow_dispatch:

# Serialize with the deal scanner — both commit to main.
concurrency:
  group: repo-commits
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run watchlist scanner
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: python3 watchlist_scanner.py

      - name: Commit price history
        run: |
          git config user.name "Watchlist Bot"
          git config user.email "bot@arbitrage-life"
          git add watchlist_prices.json
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "chore: update watchlist prices [skip ci]"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push failed (attempt $i) — rebasing and retrying"
            git pull --rebase origin main
            sleep 5
          done
          echo "::error::Failed to push watchlist prices after 3 attempts"
          exit 1

      - name: Alert on failure (dead-man switch)
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": ${CHAT_ID}, \"text\": \"⚠️ Watchlist Scanner run FAILED — check GitHub Actions: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            || true
