name: Watchlist Scanner — PRG-ASU + PRG-TYO

on:
  schedule:
    # Daily at 09:00 UTC (11:00 CEST)
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run watchlist scanner
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: python3 watchlist_scanner.py

      - name: Commit price history
        run: |
          git config user.name "Watchlist Bot"
          git config user.email "bot@arbitrage-life"
          git add watchlist_prices.json || true
          git diff --staged --quiet || git commit -m "chore: update watchlist prices [skip ci]"
          git push || true
